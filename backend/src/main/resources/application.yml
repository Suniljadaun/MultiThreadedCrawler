spring:
  application:
    name: finintel-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finintel}
    username: ${POSTGRES_USER:finintel}
    password: ${POSTGRES_PASSWORD:finintel}

  jpa:
    # Schema is owned by Flyway, Hibernate only checks it matches
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
