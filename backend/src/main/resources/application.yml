spring:
  application:
    name: finintel-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:finintel}
    username: ${POSTGRES_USER:finintel}
    password: ${POSTGRES_PASSWORD:finintel}

  jpa:
    # Schema is owned by Flyway, Hibernate only checks it matches
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast instead of blocking 60s when Kafka is down; the outbox retries later
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
    # Timers for every send and every handled record (tagged with the exception on failure)
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast when Redis is down; the cache then falls back to the database
      timeout: 500ms
      connect-timeout: 500ms

server:
  port: ${SERVER_PORT:8080}

logging:
  # Request id in every log line. For JSON logs set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # Histogram buckets so Prometheus can compute p95/p99
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
        spring.kafka.listener: true

app:
  cache:
    portfolio:
      enabled: true
      ttl: 60s
  orders:
    # Synthetic symbols only (see A-005)
    supported-symbols: ACME,GLOBEX,INITECH,UMBRELLA,STARK
  outbox:
    publisher:
      enabled: true
      interval-ms: 500
      batch-size: 100
      # Batches per run while there is a backlog
      max-rounds: 20
      send-timeout-ms: 10000
