# Both apps run on the host (mvn spring-boot:run, uvicorn), so Prometheus reaches them via host.docker.internal
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
