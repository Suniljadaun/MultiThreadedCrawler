[project]
name = "finintel-ai-service"
version = "0.1.0"
description = "Research assistant (RAG) for the FinIntel learning platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pgvector>=0.5,<1",
    "numpy>=2,<3",
    "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "testcontainers[postgres]>=4.15,<5",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit list, so a new ruff release cannot change what CI checks:
# syntax errors, undefined names, unused imports/variables, common mistakes
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (real PostgreSQL + pgvector)"]
# Same split as the backend: plain `pytest` = fast tests, `pytest -m integration` = Docker tests
addopts = "-m 'not integration'"
filterwarnings = [
    # Raised inside FastAPI's TestClient import, not by our code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
