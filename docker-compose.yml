# Infrastructure only:        docker compose up -d
# Whole system (+ backend, ai-service built from source): docker compose --profile app up -d --build

services:
  postgres:
    # Postgres 17 with the pgvector extension (needed later for the AI service, see ADR-005)
    image: pgvector/pgvector:pg17
    container_name: finintel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finintel}
      POSTGRES_USER: ${POSTGRES_USER:-finintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finintel}
    # Host port 5433 so it does not clash with a local PostgreSQL on 5432
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finintel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single broker in KRaft mode (no ZooKeeper).
    # Two listeners: localhost:9092 for apps on the host, kafka:29092 for containers.
    image: apache/kafka:4.0.0
    container_name: finintel-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  redis:
    # Cache only; losing its data is harmless (see docs/caching.md)
    image: redis:7.4-alpine
    container_name: finintel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Only with --profile app; during development the backend usually runs on the host (mvn spring-boot:run)
    profiles: ["app"]
    build: ./backend
    container_name: finintel-backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finintel}
      POSTGRES_USER: ${POSTGRES_USER:-finintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finintel}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    # Offline providers by default (hash embeddings, extractive answers), see ai-service/.env.example
    profiles: ["app"]
    build: ./ai-service
    container_name: finintel-ai-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finintel}
      POSTGRES_USER: ${POSTGRES_USER:-finintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finintel}
    # Sample documents for: docker compose exec ai-service python -m app.ingestion.cli /data/documents
    volumes:
      - ./test-data/documents:/data/documents:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    # Scrapes the backend and ai-service running on the host (see infra/prometheus/prometheus.yml)
    image: prom/prometheus:v3.5.0
    container_name: finintel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # host.docker.internal works on Docker Desktop; this line makes it work on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    # Dashboard and data source are provisioned from infra/grafana, nothing to click
    image: grafana/grafana:12.1.0
    container_name: finintel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local only: open dashboards without logging in
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
