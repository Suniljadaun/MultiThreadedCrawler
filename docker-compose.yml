# Local dev infrastructure. Start with: docker compose up -d

services:
  postgres:
    # Postgres 17 with the pgvector extension (needed later for the AI service, see ADR-005)
    image: pgvector/pgvector:pg17
    container_name: finintel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finintel}
      POSTGRES_USER: ${POSTGRES_USER:-finintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finintel}
    # Host port 5433 so it does not clash with a local PostgreSQL on 5432
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finintel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single broker in KRaft mode (no ZooKeeper). The image's default config
    # listens on localhost:9092, which is what the app expects.
    image: apache/kafka:4.0.0
    container_name: finintel-kafka
    ports:
      - "9092:9092"

  redis:
    # Cache only; losing its data is harmless (see docs/caching.md)
    image: redis:7.4-alpine
    container_name: finintel-redis
    ports:
      - "6379:6379"

  prometheus:
    # Scrapes the backend and ai-service running on the host (see infra/prometheus/prometheus.yml)
    image: prom/prometheus:v3.5.0
    container_name: finintel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # host.docker.internal works on Docker Desktop; this line makes it work on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    # Dashboard and data source are provisioned from infra/grafana, nothing to click
    image: grafana/grafana:12.1.0
    container_name: finintel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local only: open dashboards without logging in
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
