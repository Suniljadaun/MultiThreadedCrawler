name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - compile, unit and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests (surefire) + integration tests on Testcontainers (failsafe)
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: backend-jar
          path: backend/target/finintel-backend-*.jar

  ai-service:
    name: AI service - lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: pytest -m integration

  system:
    name: Docker images + end-to-end smoke test
    needs: [backend, ai-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose --profile app config -q
      - run: docker compose --profile app up -d --build
      - run: bash scripts/ci/smoke-test.sh
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - if: always()
        run: docker compose --profile app down -v
